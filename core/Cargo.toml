[workspace]
resolver = "2"
members = [
    "crates/aion-types",
    "crates/aion-hardware",
    "crates/aion-models",
    "crates/aion-runtime",
    "crates/aion-core",
    "crates/aion-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
